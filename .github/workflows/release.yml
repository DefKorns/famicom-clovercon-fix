name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^Version: .*/Version: ${GITHUB_REF_NAME#v}/" mod/readme.md

      - name: Build
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shonen_jump_clovercon_fix
          path: out/shonen_jump_clovercon_fix.hmod

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/shonen_jump_clovercon_fix.hmod \
            --title "Shonen Jump Clovercon Fix $GITHUB_REF_NAME" \
            --generate-notes
