name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  hmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/^Version: .*/Version: ${GITHUB_REF_NAME#v}/" mod/readme.md

      - name: Build
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shonen_jump_clovercon_fix
          path: out/shonen_jump_clovercon_fix.hmod

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/shonen_jump_clovercon_fix.hmod \
            --title "Shonen Jump Clovercon Fix $GITHUB_REF_NAME" \
            --generate-notes $prerelease

      - name: Rebuild the hakchi-repo hub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HUB_DISPATCH_TOKEN not set - the hub picks this release up on its daily build"
            exit 0
          fi
          gh api repos/DefKorns/hakchi-repo/dispatches -f event_type=hmod-released
